<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101411"><title>إدارة سعودي دايت</title><style>
:root{--bg:#0b0f0c;--panel:#151c17;--green:#a6ef45;--line:#29342c;--muted:#a8b5aa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(rgba(7,12,9,.88),rgba(7,12,9,.91)),url("https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=1800&auto=format&fit=crop&q=85") center/cover fixed;background-color:var(--bg);color:#f5f7f4;font-family:system-ui,sans-serif}.wrap{width:min(1000px,92%);margin:25px auto}.box{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;margin:15px 0}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;background:#0b120d;color:white;border:1px solid #39483b;border-radius:9px;font:inherit}button{padding:11px 16px;border:0;border-radius:10px;background:var(--green);font-weight:800;cursor:pointer}button.alt{background:#29372c;color:white}h1{font-size:25px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#263329;color:white}.tab.on{background:var(--green);color:#101510}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.hidden{display:none}.entry{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Premium bodybuilding admin theme */
body{background:linear-gradient(180deg,rgba(4,9,6,.86),rgba(4,9,6,.92)),url("https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=1900&auto=format&fit=crop&q=90") center/cover fixed;background-color:#080d0b;color:#f4f8f4}
.wrap{width:min(1080px,92%);margin:28px auto}
h1{font-size:29px;font-weight:950;letter-spacing:-.5px}
.box{background:rgba(12,21,16,.94);border:1px solid rgba(181,243,74,.22);box-shadow:0 15px 38px rgba(0,0,0,.28);backdrop-filter:blur(10px);border-radius:20px;padding:22px}
input,textarea,select{background:#080f0b;color:#f4f8f4;border:1px solid #35483a;border-radius:11px}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(181,243,74,.45);border-color:#b5f34a}
button{background:#b5f34a;color:#10170c;border-radius:11px;box-shadow:0 6px 18px rgba(181,243,74,.12)}
button.alt,.tab{background:#1b2a20;color:#eaf2eb;border:1px solid rgba(255,255,255,.10);box-shadow:none}
.tab.on{background:#b5f34a;color:#10170c;border-color:#b5f34a}
.muted{color:#b6c4b9}.entry{border-color:rgba(255,255,255,.12);padding:15px 8px}
#app>.tabs{padding:8px;background:rgba(5,12,8,.72);border:1px solid rgba(181,243,74,.18);border-radius:15px}
@media(max-width:600px){body{background-attachment:scroll}.wrap{width:94%;margin:16px auto}.box{padding:16px}.tabs button{flex:1 1 auto}}

</style></head><body><main class="wrap"><h1>لوحة تحكم <span style="color:var(--green)">سعودي دايت</span></h1><p class="muted">إدارة الوجبات والاشتراكات والطلبات وإعدادات المتجر.</p>

<section id="loginBox" class="box"><h2>تسجيل دخول صاحب المتجر</h2><p class="muted">أدخل كلمة مرور لوحة التحكم للمتابعة.</p><input id="adminPassword" type="password" autocomplete="current-password" placeholder="كلمة مرور لوحة التحكم"><button onclick="login()">دخول</button><p id="loginError" class="muted"></p></section><section id="app" class="hidden"><nav class="tabs"><button class="tab on" onclick="tab('orders',this)">طلبات الوجبات</button><button class="tab" onclick="tab('suborders',this)">طلبات الاشتراك</button><button class="tab" onclick="tab('meals',this)">الوجبات</button><button class="tab" onclick="tab('plans',this)">الاشتراكات</button><button class="tab" onclick="tab('settings',this)">إعدادات المتجر</button></nav>
<div id="orders" class="box"><h2>الطلبات الأخيرة</h2><div id="orderList"></div></div><div id="suborders" class="box hidden"><h2>طلبات الاشتراك</h2><p class="muted">طلبات البرامج الأسبوعية والشهرية منفصلة عن طلبات الوجبات.</p><div id="subscriptionOrderList"></div></div>
<div id="meals" class="box hidden"><h2>إضافة / تعديل وجبة</h2><input id="mealId" type="hidden"><div class="row"><label>اسم الوجبة<input id="mName"></label><label>السعر<input id="mPrice" type="number"></label><label>رابط صورة الوجبة (اختياري)<input id="mImage" type="url" placeholder="https://..." oninput="imageUrlChanged()"></label><label>أو اختر صورة من الاستوديو<input id="mImageFile" type="file" accept="image/*" onchange="uploadMealImage(this)"></label><div id="mealImagePreview" style="grid-column:1/-1"></div><label>التصنيف<input id="mCat" type="number" placeholder="رقم التصنيف"></label><label>السعرات<input id="mCal" type="number"></label><label>البروتين (غ)<input id="mPro" type="number"></label><label>الكربوهيدرات (غ)<input id="mCarb" type="number"></label><label>الدهون (غ)<input id="mFat" type="number"></label></div><label>الوصف<textarea id="mDesc"></textarea></label><button onclick="saveMeal()">حفظ الوجبة</button><div id="mealList"></div></div>
<div id="plans" class="box hidden"><h2>إضافة / تعديل باقة</h2><input id="pId" type="hidden"><div class="row"><label>اسم الباقة<input id="pName"></label><label>المدة<select id="pDuration"><option value="weekly">أسبوعية</option><option value="monthly">شهرية</option></select></label><label>السعر<input id="pPrice" type="number"></label><label>عدد الوجبات يومياً<input id="pMeals" type="number" value="3"></label></div><label>الوصف<textarea id="pDesc"></textarea></label><button onclick="savePlan()">حفظ الباقة</button><div id="planList"></div></div>
<div id="settings" class="box hidden"><h2>إعدادات المتجر</h2><div class="row"><label>اسم المتجر<input id="sName"></label><label>الشعار النصي<input id="sTag"></label><label>رقم واتساب مع مفتاح الدولة<input id="sWa" placeholder="9665xxxxxxxx"></label><label>رسوم التوصيل<input id="sFee" type="number"></label><label>حد التوصيل المجاني<input id="sFree" type="number"></label><label>عنوان الواجهة<input id="sHero"></label></div><label>وصف الواجهة<input id="sSub"></label><button onclick="saveSettings()">حفظ الإعدادات</button></div>
</section></main><script>
let data={};let selectedImageData="";const $=id=>document.getElementById(id);async function api(path,method='GET',body){const r=await fetch('/api/admin/'+path,{method,headers:{'content-type':'application/json','authorization':'Bearer '+(sessionStorage.getItem('sd_admin_key')||'')},body:body?JSON.stringify(body):undefined});const d=await r.json();if(r.status===401){sessionStorage.removeItem('sd_admin_key');$('app').classList.add('hidden');$('loginBox').classList.remove('hidden')}if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function login(){const p=$('adminPassword').value;if(!p){$('loginError').textContent='أدخل كلمة المرور';return}try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تسجيل الدخول');sessionStorage.setItem('sd_admin_key',p);$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('loginError').textContent='';await refresh()}catch(e){$('loginError').textContent=e.message}}

function tab(id,el){document.querySelectorAll('#app>.box').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
async function refresh(){data=await api('overview');const orderRow=o=>'<div class="entry"><span>#'+o.id+' · '+(o.customer_name||'طلب بدون اسم')+' · '+o.total+' ر.س <small class="muted">'+o.created_at+'</small><br><small class="muted">'+(o.customer_phone||'')+'</small></span><select onchange="status('+o.id+',this.value)"><option '+(o.status==='new'?'selected':'')+' value="new">جديد</option><option '+(o.status==='preparing'?'selected':'')+' value="preparing">قيد التجهيز</option><option '+(o.status==='done'?'selected':'')+' value="done">مكتمل</option><option '+(o.status==='cancelled'?'selected':'')+' value="cancelled">ملغي</option></select></div>';$('orderList').innerHTML=data.orders.filter(o=>o.order_type!=='subscription').map(orderRow).join('')||'<p class="muted">لا توجد طلبات وجبات حتى الآن.</p>';$('subscriptionOrderList').innerHTML=data.orders.filter(o=>o.order_type==='subscription').map(orderRow).join('')||'<p class="muted">لا توجد طلبات اشتراك حتى الآن.</p>';$('mealList').innerHTML=data.meals.map(m=>'<div class="entry">'+m.name+' · '+m.price+' ر.س <button class="alt" onclick="editMeal('+m.id+')">تعديل</button></div>').join('');$('planList').innerHTML=data.plans.map(p=>'<div class="entry">'+p.name+' · '+p.price+' ر.س <button class="alt" onclick="editPlan('+p.id+')">تعديل</button></div>').join('')}
async function status(id,status){await api('order-status','POST',{id,status})}
function showMealImage(src){$("mealImagePreview").innerHTML=src?'<img src="'+src+'" alt="معاينة الصورة" style="max-width:180px;max-height:130px;object-fit:cover;border-radius:12px;border:1px solid #39483b">':'<span class="muted">لم يتم اختيار صورة</span>'}
function imageUrlChanged(){selectedImageData="";showMealImage($("mImage").value.trim())}
function uploadMealImage(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith("image/")){alert("اختر ملف صورة صالحاً");input.value="";return}if(file.size>12*1024*1024){alert("حجم الصورة كبير؛ اختر صورة أقل من 12 ميجابايت");input.value="";return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1100/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let quality=.78;const compress=()=>canvas.toBlob(blob=>{if(!blob){alert("تعذر تجهيز الصورة");return}if(blob.size>500*1024&&quality>.42){quality-=.1;compress();return}if(blob.size>650*1024){alert("الصورة ما زالت كبيرة؛ اختر صورة أصغر");return}const fr=new FileReader();fr.onload=()=>{selectedImageData=fr.result;$("mImage").value="";showMealImage(selectedImageData)};fr.readAsDataURL(blob)},"image/jpeg",quality)};img.onerror=()=>alert("تعذر قراءة الصورة");img.src=reader.result};reader.readAsDataURL(file)}
async function saveMeal(){const b={id:Number($('mealId').value)||undefined,name:$('mName').value,price:$('mPrice').value,image_url:selectedImageData||$('mImage').value,category_id:$('mCat').value,calories:$('mCal').value,protein:$('mPro').value,carbs:$('mCarb').value,fat:$('mFat').value,description:$('mDesc').value};await api('meal','POST',b);alert('تم حفظ الوجبة');refresh()}
function editMeal(id){let m=data.meals.find(x=>x.id===id);$('mealId').value=m.id;$('mName').value=m.name;$('mPrice').value=m.price;selectedImageData=(m.image_url||'').startsWith('data:image/')?m.image_url:'';$('mImage').value=selectedImageData?'':(m.image_url||'');showMealImage(m.image_url||'');$('mImageFile').value='';$('mCat').value=m.category_id||'';$('mCal').value=m.calories;$('mPro').value=m.protein;$('mCarb').value=m.carbs;$('mFat').value=m.fat;$('mDesc').value=m.description;tab('meals',document.querySelectorAll('.tab')[1])}
async function savePlan(){await api('plan','POST',{id:Number($('pId').value)||undefined,name:$('pName').value,duration:$('pDuration').value,price:$('pPrice').value,meals_per_day:$('pMeals').value,description:$('pDesc').value});alert('تم حفظ الباقة');refresh()}
function editPlan(id){let p=data.plans.find(x=>x.id===id);$('pId').value=p.id;$('pName').value=p.name;$('pDuration').value=p.duration;$('pPrice').value=p.price;$('pMeals').value=p.meals_per_day;$('pDesc').value=p.description;tab('plans',document.querySelectorAll('.tab')[2])}
async function saveSettings(){await api('settings','POST',{store_name:$('sName').value,tagline:$('sTag').value,whatsapp:$('sWa').value,delivery_fee:$('sFee').value,free_delivery_minimum:$('sFree').value,hero_title:$('sHero').value,hero_subtitle:$('sSub').value});alert('تم حفظ الإعدادات')}
if(sessionStorage.getItem('sd_admin_key')){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');refresh().catch(e=>alert(e.message))}
</script></body></html>

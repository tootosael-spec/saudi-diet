name = "saudi-diet"
main = "src/index.js"
compatibility_date = "2026-11-18"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin*"]

[[d1_databases]]
binding = "DB"
database_name = "saudi-diet"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
